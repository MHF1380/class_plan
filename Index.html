<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه ریاضی و علوم – ششم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#bfe6ff;--bg2:#fff6d6;--card:#ffffff;--ink:#1d2b53;--muted:#5b6b8f;--line:#d9e6f7;
--math:#ff8a3d;--sci:#2bb673;--hj:#3b82f6;--mg:#a855f7;--shadow:0 6px 0 rgba(29,43,83,.12),0 14px 24px rgba(29,43,83,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12203d;--bg2:#2a2145;--card:#1d2a4a;--ink:#f1f5ff;--muted:#a9b6d6;--line:#33456e;--shadow:0 6px 0 rgba(0,0,0,.35),0 14px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg1:#12203d;--bg2:#2a2145;--card:#1d2a4a;--ink:#f1f5ff;--muted:#a9b6d6;--line:#33456e;--shadow:0 6px 0 rgba(0,0,0,.35),0 14px 24px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;padding:18px 12px 40px}
.wrap{max-width:1000px;margin:auto}
h1{margin:0;text-align:center;font-weight:900;font-size:clamp(22px,5vw,36px);text-shadow:0 3px 0 rgba(255,255,255,.4)}
.sub{text-align:center;color:var(--muted);margin:6px 0 16px}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.scroll{overflow-x:auto;padding-bottom:8px}
table{border-collapse:separate;border-spacing:8px;min-width:760px;width:100%}
th{background:var(--card);border-radius:18px;padding:8px 4px;box-shadow:var(--shadow);font-size:14px}
th small{display:block;color:var(--muted);font-weight:400;font-size:11px}
th.day{background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#3a2300;font-size:16px;font-weight:900}
td{background:rgba(255,255,255,.35);border-radius:18px;height:78px;padding:5px;vertical-align:middle}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) td{background:rgba(255,255,255,.06)}}
.cell{display:flex;flex-direction:column;gap:4px}
.chip{border:0;cursor:pointer;font:inherit;color:#fff;font-weight:900;font-size:13px;border-radius:14px;padding:7px 4px;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .12s;display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%}
.chip:hover{transform:translateY(-3px) scale(1.04)}.chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.chip.r{background:linear-gradient(135deg,#ffa45c,var(--math))}
.chip.s{background:linear-gradient(135deg,#4cd596,var(--sci))}
.chip em{font-style:normal;font-weight:700;font-size:11px;background:rgba(255,255,255,.28);border-radius:8px;padding:1px 6px}
.chip.g1 em{background:var(--hj)}.chip.g2 em{background:var(--mg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:center}
.stat b{font-size:28px;display:block}
.ov{position:fixed;inset:0;background:rgba(10,18,40,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:28px;width:min(460px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.4);overflow:hidden;animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mh{padding:16px 18px;color:#fff}
.mh.r{background:linear-gradient(135deg,#ffa45c,var(--math))}.mh.s{background:linear-gradient(135deg,#4cd596,var(--sci))}
.mh h2{margin:0;font-size:20px}.mh p{margin:4px 0 0;font-size:13px;opacity:.95}
.mb{padding:12px 18px;overflow:auto}
ol{margin:0;padding:0 22px}li{padding:6px 0;border-bottom:1px dashed var(--line)}
textarea{width:100%;height:220px;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:14px;padding:10px}
.mf{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-weight:700;cursor:pointer;background:var(--line);color:var(--ink)}
.mf .btn{min-width:130px}
.btn.p{background:#3b82f6;color:#fff}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.modal.wide{width:min(980px,100%)}
.tabs{display:flex;gap:6px;padding:10px 14px 0;background:var(--card)}
.tb{flex:1;border:0;border-radius:14px 14px 0 0;padding:9px 4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--line);color:var(--muted)}
.tb.on{background:#3b82f6;color:#fff}
.db{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-weight:700}
.db input,.add input{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.add{display:flex;gap:8px;margin-bottom:10px}.add input{flex:1;min-width:0}.add .btn{flex:0 0 auto;padding:8px 16px}
.gs{overflow:auto;max-height:52vh;border-radius:14px;border:1px solid var(--line)}
.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.gt th,.gt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}
.gt tr:first-child th{position:sticky;top:0;background:var(--card);z-index:2;box-shadow:none;border-radius:0}
.gt .nm{position:sticky;right:0;background:var(--card);z-index:1;text-align:right;white-space:nowrap;box-shadow:none;border-radius:0;font-weight:700}
.gt tr:first-child .nm{z-index:3}
.x{border:0;background:transparent;color:#ef4444;font-size:16px;cursor:pointer;margin-inline-start:4px}
.cl{min-width:78px;border:2px dashed var(--line);border-radius:10px;padding:6px 4px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;background:transparent;color:var(--muted)}
.cl.l1{background:#ff6b6b;border:2px solid #ff6b6b;color:#fff}.cl.l2{background:#ffc83d;border:2px solid #ffc83d;color:#3a2a00}.cl.l3{background:#34c38f;border:2px solid #34c38f;color:#fff}
.rbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rbtn{border:0;cursor:pointer;font:inherit;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(135deg,#6aa9ff,#3b82f6);border-radius:18px;padding:11px 26px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .12s}
.rbtn:hover{transform:translateY(-3px)}.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mh.rp{background:linear-gradient(135deg,#6aa9ff,#3b82f6)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-weight:700;font-size:14px}
.fld select,.fld input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
#mob{display:none}
.dc{background:var(--card);border-radius:22px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.dc h3{margin:0 0 8px;font-size:18px;font-weight:900}
.dc .chip{margin-bottom:8px;padding:12px 14px;font-size:16px;border-radius:16px}
.dc .chip small{flex:1;text-align:right;font-weight:700;font-size:12px;opacity:.95}
.dc .chip em{font-size:12px;padding:3px 10px}
.wk{border:0;border-radius:12px;padding:9px 12px;font:inherit;font-weight:700;font-size:13px;background:var(--line);color:var(--ink);cursor:pointer;white-space:nowrap}
@media (max-width:700px){
body{padding:12px 8px 30px}
.legend{gap:6px}.pill{font-size:12px;padding:5px 10px}
.rbtn{font-size:14px;padding:10px 14px;flex:1}
.ov{padding:0;align-items:stretch}
.modal,.modal.wide{width:100%;height:100%;max-height:100%;border-radius:0}
.mh{padding:12px 14px}.mh h2{font-size:17px}
.tabs{padding:8px 8px 0;gap:4px}.tb{font-size:12.5px;padding:10px 2px}
.mb{padding:10px 12px;flex:1}
.gs{max-height:calc(100vh - 340px);min-height:240px}
.gt th,.gt td{padding:5px 6px}
.cl{min-width:66px;padding:10px 2px;font-size:12px}
input,select,textarea{font-size:16px}
.mf{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.db{gap:6px;flex-wrap:nowrap;font-size:13px}
.add{flex-wrap:nowrap}
}
th.day{min-width:84px;line-height:1.35}
th.day small{display:block;font-size:11px;font-weight:700;opacity:.8}
th.day.today{outline:3px solid #fff;outline-offset:-3px}
.dtask{border:0;background:rgba(255,255,255,.6);border-radius:10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-top:3px;padding:2px 8px;color:#3a2300}
.wnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.wnav b{font-size:15px;min-width:130px;text-align:center}
.addb{width:100%;min-height:56px;border:2px dashed var(--line);border-radius:14px;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.chip.cu{background:linear-gradient(135deg,#c084fc,#a855f7);justify-content:center;font-size:12px;line-height:1.3}
.mh.cu{background:linear-gradient(135deg,#c084fc,#a855f7)}
.fld textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:100%}
.tk{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tk input{width:22px;height:22px;flex:none}.tk span{flex:1}.dn{text-decoration:line-through;opacity:.55}
@media (max-width:700px){
table{min-width:600px;border-spacing:5px}
th.day{position:sticky;right:0;z-index:2;min-width:70px;padding:6px 2px}
th,td{font-size:12px}
td{height:70px;padding:3px}
.chip{font-size:11px;padding:6px 2px;border-radius:11px}
.chip em{font-size:9px;padding:0 4px}
.wnav b{min-width:110px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🚀 برنامه ریاضی و علوم پایه ششم</h1>
<p class="sub">ادبستان پسرانه توحید · روی هر زنگ بزنید تا لیست کلاس باز شود</p>
<div class="legend">
<span class="pill"><span class="dot" style="background:var(--math)"></span>ریاضی</span>
<span class="pill"><span class="dot" style="background:var(--sci)"></span>علوم</span>
<span class="pill"><span class="dot" style="background:var(--hj)"></span>شهید حججی</span>
<span class="pill"><span class="dot" style="background:var(--mg)"></span>شهید مغنیه</span>
</div>
<div class="rbar"><button class="rbtn" id="rpb">📑 گزارش دانش‌آموز</button><button class="rbtn" id="bkb" style="background:linear-gradient(135deg,#7bd88f,#34c38f)">💾 پشتیبان‌گیری</button><button class="rbtn" id="rsb" style="background:linear-gradient(135deg,#ffb35c,#ff8a3d)">📂 بازیابی</button><input type="file" id="rsf" accept=".json" hidden></div>
<div class="wnav"><button class="wk" id="wp">▶ هفته قبل</button><b id="wlabel"></b><button class="wk" id="wn">هفته بعد ◀</button><button class="wk" id="wz" style="display:none">این هفته</button></div>
<div class="scroll"><table id="t"></table></div>
<div class="stats" id="stats"></div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script>
var days=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه'];
var times=['۷:۴۵ تا ۸:۳۰','۸:۴۵ تا ۹:۳۰','۹:۴۵ تا ۱۰:۳۰','۱۰:۴۵ تا ۱۱:۳۰','۱۱:۴۵ تا ۱۲:۲۰','۱۲:۴۵ تا ۱۳:۳۰'];
var pn=['اول','دوم','سوم','چهارم','پنجم','ششم'];
var classes={
 g1:{name:'شهید حججی',d:[['','','r','r','s',''],['r','','','','',''],['','','','r','','s'],['','r','','','',''],['','','r','','','']]},
 g2:{name:'شهید مغنیه',d:[['r','r','','','',''],['','','','r','','s'],['','r','','','',''],['r','','','','',''],['','r','','s','','']]}
};
var sub={r:'ریاضی',s:'علوم'};
var rosters={};
var DEF={g1:['امیرعلی براتی','علی بهاری','محمدرضا پوستین دوز','امیرحسین جعفری','محمد هادی جلوانی','محمدصادق رضوانی','محمد مهدی شهپری فرد','سید حسین طباطبایی پناه','یحیی عطریان','سید محمدصالح میرهادیان'],g2:['علی بختیاری','محمدحسین بیکی حسن','سید سلمان ثابتی','محمدحسن جندقیان','محمدحسن حیدریان','حسین سورانی','امیرحسین شفیعی','محمدهادی شفیعی','محمدمهدی شیرعلیان','محمدحسین صالحیان','مهدیار صدیقی','امیرعلی کریمی','پارسا کریمی','امیرعلی مرادی']};
function rosterOf(k){if(!rosters[k]){rosters[k]=DEF[k].slice();try{var v=localStorage.getItem('roster2-'+k);if(v)rosters[k]=JSON.parse(v)}catch(e){}}
  if(!rosters[k]){var a=[];for(var i=1;i<=25;i++)a.push('دانش‌آموز '+i);rosters[k]=a;
    try{var v=localStorage.getItem('roster-'+k);if(v)rosters[k]=JSON.parse(v)}catch(e){}}
  return rosters[k];
}
var t=document.getElementById('t');
function wdate(d){return iso(-((new Date().getDay()+1)%7)+d+7*WK)}
function fshort(v){try{return new Date(v+'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian',{day:'numeric',month:'long'})}catch(e){return v}}
function renderT(){
  var h='<tr><th class="day">روز</th>',p,d,k;
  for(p=0;p<6;p++)h+='<th>زنگ '+pn[p]+'<small>'+times[p]+'</small></th>';
  h+='</tr>';
  for(d=0;d<5;d++){
    var dt=wdate(d),nt=(ST.todo[dt]||[]).filter(function(x){return !x.d}).length;
    h+='<tr><th class="day'+(dt==iso(0)?' today':'')+'"><b>'+days[d]+'</b><small>'+fshort(dt)+'</small><button class="dtask" data-todo="'+dt+'">📋'+(nt?' '+nt:'')+'</button></th>';
    for(p=0;p<6;p++){
      h+='<td><div class="cell">';var has=false;
      for(k in classes){var s=classes[k].d[d][p];
        if(s){has=true;h+='<button class="chip '+s+' '+k+'" data-k="'+k+'" data-s="'+s+'" data-d="'+d+'" data-p="'+p+'">'+sub[s]+'<em>'+classes[k].name.replace('شهید ','')+'</em></button>'}}
      var ck=dt+'|'+p,c=ST.cust[ck];
      if(c)h+='<button class="chip cu" data-cu="'+ck+'">'+esc(c.t)+(c.r?' ✔':'')+'</button>';
      else if(!has)h+='<button class="addb" data-new="'+ck+'">＋</button>';
      h+='</div></td>';
    }
    h+='</tr>';
  }
  t.innerHTML=h;
  document.getElementById('wlabel').textContent=fshort(wdate(0))+' تا '+fshort(wdate(4));
  document.getElementById('wz').style.display=WK?'':'none';
}
var st='';
for(var k in classes){var c={r:0,s:0};classes[k].d.forEach(function(r){r.forEach(function(x){if(x)c[x]++})});
  st+='<div class="stat">'+classes[k].name+'<b>'+c.r+' + '+c.s+'</b>ریاضی + علوم در هفته</div>';}
document.getElementById('stats').innerHTML=st;
var ov=document.getElementById('ov'),md=document.getElementById('modal');
function show(k,s,d,p,edit){
  var list=rosterOf(k),body;
  if(edit)body='<textarea id="ta">'+list.join('\n')+'</textarea><p class="note">هر نام را در یک خط بنویسید.</p>';
  else body='<ol>'+list.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ol>';
  md.innerHTML='<div class="mh '+s+'"><h2>'+sub[s]+' · کلاس '+classes[k].name+'</h2><p>'+days[d]+'، زنگ '+pn[p]+' ('+times[p]+') · '+list.length+' نفر</p></div>'+tabs('ro')+'<div class="mb">'+body+'</div><div class="mf">'+
   (edit?'<button class="btn p" id="sv">ذخیره</button>':'<button class="btn" id="ed">✏️ ویرایش لیست</button>')+'<button class="btn" id="cl">بستن</button></div>';
  md.className='modal';ov.classList.add('on');
  document.getElementById('cl').onclick=function(){ov.classList.remove('on')};
  if(edit)document.getElementById('sv').onclick=function(){
    rosters[k]=document.getElementById('ta').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    try{localStorage.setItem('roster2-'+k,JSON.stringify(rosters[k]))}catch(e){}
    show(k,s,d,p,false)};
  else document.getElementById('ed').onclick=function(){show(k,s,d,p,true)};
}
function openChip(e){var b=e.target.closest('.chip');if(!b)return;if(b.dataset.cu){openCust(b.dataset.cu);return}cx={k:b.dataset.k,s:b.dataset.s,d:+b.dataset.d,p:+b.dataset.p};DT=sessDate();show(cx.k,cx.s,cx.d,cx.p,false)}
t.addEventListener('click',function(e){var b=e.target.closest('[data-todo],[data-new]');if(b){if(b.dataset.todo)openTodo(b.dataset.todo);else openCust(b.dataset.new);return}openChip(e)});
function openCust(key){
  var m=key.split('|'),dt=m[0],p=+m[1],c=ST.cust[key]||{t:'',n:'',r:''};
  md.className='modal';
  md.innerHTML='<div class="mh cu"><h2>📝 برنامه / کار</h2><p>'+fa(dt)+' · زنگ '+pn[p]+' ('+times[p]+')</p></div><div class="mb">'+
   '<div class="fld"><label>عنوان</label><input id="cut" value="'+esc(c.t)+'" placeholder="مثلاً جلسه اولیا، مطالعه آزاد…"></div>'+
   '<div class="fld"><label>برنامه / توضیحات</label><textarea id="cun" style="height:100px">'+esc(c.n)+'</textarea></div>'+
   '<div class="fld"><label>گزارش (بعد از انجام)</label><textarea id="cur" style="height:100px">'+esc(c.r)+'</textarea></div></div>'+
   '<div class="mf"><button class="btn p" id="cus">ذخیره</button>'+(ST.cust[key]?'<button class="btn" id="cud" style="color:#ef4444">حذف</button>':'')+'<button class="btn" id="cl">بستن</button></div>';
  ov.classList.add('on');
  $('cl').onclick=function(){ov.classList.remove('on')};
  $('cus').onclick=function(){var v={t:$('cut').value.trim(),n:$('cun').value.trim(),r:$('cur').value.trim()};if(v.t||v.n||v.r){if(!v.t)v.t='برنامه';ST.cust[key]=v}else delete ST.cust[key];save();renderT();ov.classList.remove('on')};
  if(ST.cust[key])$('cud').onclick=function(){if(confirm('حذف شود؟')){delete ST.cust[key];save();renderT();ov.classList.remove('on')}};
}
function openTodo(dt){
  var L=ST.todo[dt]=ST.todo[dt]||[];
  md.className='modal';
  md.innerHTML='<div class="mh cu"><h2>📋 کارهای روز</h2><p>'+fa(dt)+'</p></div><div class="mb"><div class="add"><input id="tdn" placeholder="کار جدید…"><button class="btn p" id="tda">افزودن</button></div>'+
   (L.length?L.map(function(x,i){return '<label class="tk"><input type="checkbox" data-i="'+i+'"'+(x.d?' checked':'')+'><span'+(x.d?' class="dn"':'')+'>'+esc(x.t)+'</span><button class="x" data-i="'+i+'">×</button></label>'}).join(''):'<p class="note">هنوز کاری برای این روز ثبت نشده است.</p>')+
   '</div><div class="mf"><button class="btn" id="cl">بستن</button></div>';
  ov.classList.add('on');
  $('cl').onclick=function(){ov.classList.remove('on');renderT()};
  var add=function(){var v=$('tdn').value.trim();if(!v)return;L.push({t:v,d:0});save();openTodo(dt);$('tdn').focus()};
  $('tda').onclick=add;$('tdn').onkeydown=function(e){if(e.key=='Enter')add()};
